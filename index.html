<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1020">
<title>Meu Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0D1020;--s1:#151933;--s2:#1D2245;--line:#2A3058;--ink:#ECEEFB;--mute:#8E94BA;--violet:#8B7CFF;--coral:#FF6B7A;--amber:#FFB454;--mint:#3DDC97;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 Manrope,system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:20px 16px 72px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3,.big,.num{font-family:Sora,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
input{font:inherit;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
input::placeholder{color:#5E6490}
label{display:block;font-size:.8rem;color:var(--mute);margin:0 0 6px;font-weight:600}
.pos{color:var(--mint)}.neg{color:var(--coral)}
.violet{background:var(--violet)}.coral{background:var(--coral)}.amber{background:var(--amber)}.mint{background:var(--mint)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand b{font:700 1.15rem Sora;display:block}.brand small{color:var(--mute);font-size:.78rem}
.months{display:flex;align-items:center;gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:4px}
.months button{width:36px;height:36px;border-radius:50%;font-size:1.2rem;color:var(--mute)}
.months button:hover{background:var(--s2);color:var(--ink)}
.months span{min-width:150px;text-align:center;font-weight:700;text-transform:capitalize}
.sync{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--mute)}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--amber)}
.sync i.on{background:var(--mint);box-shadow:0 0 0 4px #3ddc9722}

.hero{background:var(--s1);border:1px solid var(--line);border-radius:28px;padding:32px;margin:20px 0 14px}
.hero p{margin:0}.k{color:var(--mute);font-weight:600}
.big{font-size:clamp(2.6rem,9vw,4.6rem);font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:6px 0}
.verdict{color:var(--mute)}
.split{display:flex;gap:3px;height:18px;margin:26px 0 14px;border-radius:999px;overflow:hidden;background:var(--s2)}
.split i{min-width:5px;border-radius:5px;transition:flex 1s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;list-style:none;margin:0;padding:0;font-size:.85rem;color:var(--mute)}
.legend li{display:flex;align-items:center;gap:8px}.legend i{width:10px;height:10px;border-radius:50%}
.legend b{color:var(--ink);font-family:Sora}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
.stat span{font-size:.8rem;color:var(--mute);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.stat b{display:block;font:700 1.2rem Sora;margin-top:4px}
.stat button{color:var(--violet);font-size:.78rem;font-weight:700}

.cols{display:grid;gap:14px;grid-template-columns:1.45fr 1fr;grid-template-areas:"led form" "led cats" "led bills";align-items:start}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:20px}
.card h2{font-size:1.02rem;margin:0 0 14px}
#led{grid-area:led}#form{grid-area:form}#catcard{grid-area:cats}#billcard{grid-area:bills}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.row h2{margin:0}
.link{color:var(--violet);font-weight:700;font-size:.82rem}

.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--mute);font-weight:700;font-size:.85rem;background:var(--s2)}
.pill.sm{padding:5px 11px;font-size:.78rem}
.pill[aria-pressed=true]{background:var(--violet);border-color:var(--violet);color:#0D1020}
.pill:not([aria-pressed=true]):hover{color:var(--ink);border-color:var(--violet)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{margin-top:14px}
.cta{width:100%;margin-top:16px;padding:13px;border-radius:14px;background:var(--violet);color:#0D1020;font:700 .95rem Sora}
.cta:hover{filter:brightness(1.1)}
.cta.ghost{background:var(--s2);color:var(--ink);border:1px solid var(--line)}

.tools{display:flex;gap:10px;margin:16px 0 4px;flex-wrap:wrap}
.tools input{flex:1;min-width:140px}
.day{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mute);margin:20px 0 4px;font-weight:600}
.day .num{font-size:.8rem}
.item{display:grid;grid-template-columns:40px 1fr auto 28px;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ic{width:40px;height:40px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:1.1rem}
.who b{display:block;font-weight:700}.who small{color:var(--mute);font-size:.8rem}
.item .num{font-weight:600;font-size:.92rem;white-space:nowrap}
.x{color:var(--mute);border-radius:50%;width:28px;height:28px;font-size:.85rem}
.x:hover{background:#ff6b7a22;color:var(--coral)}
.empty{color:var(--mute);font-size:.9rem;margin:8px 0}

.bar{margin-bottom:12px}
.bar div{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:5px}
.bar i{display:block;height:8px;border-radius:99px;background:var(--coral)}
.bill{display:grid;grid-template-columns:44px 1fr 96px 28px;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.bill .off{color:var(--mute);text-decoration:line-through}
.bill .amt{text-align:right;padding:7px 9px;font-family:Sora;font-size:.85rem}
.sw{appearance:none;width:38px;height:22px;padding:0;border-radius:99px;position:relative;cursor:pointer}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--mute);transition:left .2s}
.sw:checked{background:var(--violet);border-color:var(--violet)}.sw:checked::after{left:18px;background:#fff}
.addb{display:grid;grid-template-columns:1fr 96px auto;gap:8px;margin-top:14px}
.addb button{padding:0 16px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-weight:700}
.tot{display:flex;justify-content:space-between;margin-top:12px;font-weight:700}

dialog{background:var(--s1);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:24px;width:min(360px,92vw)}
dialog::backdrop{background:#070914cc}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ink);color:#0D1020;padding:11px 18px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--coral)}

@media(max-width:860px){
  .cols{grid-template-columns:1fr;grid-template-areas:"form" "led" "cats" "bills"}
  .stats{grid-template-columns:1fr 1fr}
  .hero{padding:24px 20px}
  .months span{min-width:120px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><b>Meu Financeiro</b><small>Grupo Star Motos · painel pessoal</small></div>
    <nav class="months" aria-label="Mês">
      <button onclick="shift(-1)" aria-label="Mês anterior">‹</button>
      <span id="month-label"></span>
      <button onclick="shift(1)" aria-label="Próximo mês">›</button>
    </nav>
    <div class="sync"><i id="dot"></i><span id="sync">Conectando…</span></div>
  </header>

  <section class="hero">
    <p class="k">Sobra este mês</p>
    <div class="big" id="balance">—</div>
    <p class="verdict" id="verdict"></p>
    <div class="split" id="split"></div>
    <ul class="legend" id="legend"></ul>
  </section>

  <section class="stats">
    <div class="stat"><span>Salário <button onclick="openSalary()">Editar</button></span><b id="s-sal">—</b></div>
    <div class="stat"><span>Entradas e acréscimos</span><b class="pos" id="s-in">—</b></div>
    <div class="stat"><span>Contas fixas</span><b class="neg" id="s-bills">—</b></div>
    <div class="stat"><span>Compras e retiradas</span><b class="neg" id="s-out">—</b></div>
  </section>

  <div class="cols">
    <form class="card" id="form" onsubmit="submitTx(event)">
      <h2>Nova movimentação</h2>
      <div class="pills" id="types"></div>
      <div class="g2 fld">
        <div><label for="f-amount">Valor (R$)</label><input id="f-amount" inputmode="decimal" placeholder="0,00" autocomplete="off" required></div>
        <div><label for="f-date">Data</label><input id="f-date" type="date"></div>
      </div>
      <div class="fld"><label for="f-cat">Categoria</label><input id="f-cat" placeholder="Escolha abaixo ou digite outra" autocomplete="off"></div>
      <div class="pills fld" id="chips"></div>
      <div class="fld"><label for="f-desc">Descrição (opcional)</label><input id="f-desc" placeholder="Detalhes rápidos" autocomplete="off"></div>
      <button class="cta" type="submit" id="submit">Registrar</button>
    </form>

    <section class="card" id="led">
      <div class="row"><h2>Movimentações</h2><button class="link" onclick="exportCsv()">Exportar CSV</button></div>
      <div class="tools">
        <input id="q" type="search" placeholder="Buscar por categoria ou descrição" oninput="q=this.value;renderLedger()" aria-label="Buscar">
      </div>
      <div class="pills" id="filters"></div>
      <div id="ledger"></div>
    </section>

    <section class="card" id="catcard">
      <h2>Para onde foi o dinheiro</h2>
      <div id="cats"></div>
    </section>

    <section class="card" id="billcard">
      <h2>Contas fixas</h2>
      <div id="bills"></div>
      <div class="addb">
        <input id="nb-name" placeholder="Nome da conta" aria-label="Nome da conta">
        <input id="nb-amt" inputmode="decimal" placeholder="Valor" aria-label="Valor da conta">
        <button onclick="addBill()">Adicionar</button>
      </div>
      <div class="tot"><span>Total ativo</span><span class="num" id="bills-total">—</span></div>
    </section>
  </div>
</div>

<dialog id="dlg">
  <form onsubmit="saveSalary(event)">
    <h2 style="margin:0 0 14px;font-size:1.1rem">Editar salário</h2>
    <label for="d-sal">Salário mensal (R$)</label>
    <input id="d-sal" inputmode="decimal" required>
    <button class="cta" type="submit">Salvar salário</button>
    <button class="cta ghost" type="button" onclick="dlg.close()">Cancelar</button>
  </form>
</dialog>
<div id="toast" role="status"></div>

<script>
// A anon key foi feita para ficar no cliente: o acesso é controlado pelas policies do banco.
const CFG = { url: 'https://cantpchtkijvqwlcgklz.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhbnRwY2h0a2lqdnF3bGNna2x6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMDAzNzcsImV4cCI6MjEwNTc3NjM3N30.Te7boSxpucRsa9JtHUBa-Ap18zlNT1WsvqKWHSDvnfk' };
const sb = supabase.createClient(CFG.url, CFG.key);

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const brl = (n) => Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const num = (v) => { v = String(v).replace(/[R$\s]/g, ''); if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.'); return parseFloat(v); };

const T = {
  compra:    { l: 'Compra',    i: '🛒', s: -1 },
  retirada:  { l: 'Retirada',  i: '💵', s: -1 },
  entrada:   { l: 'Entrada',   i: '📥', s: 1 },
  acrescimo: { l: 'Acréscimo', i: '➕', s: 1 },
};
const DEF = {
  compra: ['Almoço', 'Mercado', 'Lanche', 'Empréstimo', 'Software'],
  entrada: ['Freela', 'Venda', 'Reembolso'],
  acrescimo: ['Bônus', 'Presente', 'Rendimento'],
  retirada: [],
};

let ym = iso(new Date()).slice(0, 7), tx = [], bills = [], salary = 0, type = 'compra', flt = 'all', q = '';

function toast(m, err) {
  const e = $('toast');
  e.textContent = m; e.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => (e.className = ''), 2600);
}
async function ok(p) {
  const r = await p;
  if (r.error) { toast(r.error.message, 1); throw r.error; }
  return r.data;
}
const sum = (t) => tx.filter((x) => x.type === t).reduce((s, x) => s + Number(x.amount), 0);
const billsTotal = () => bills.filter((b) => b.active).reduce((s, b) => s + Number(b.amount), 0);

/* ---------- carregar ---------- */
function setDate() { $('f-date').value = ym === iso(new Date()).slice(0, 7) ? iso(new Date()) : ym + '-01'; }
function shift(n) {
  const [y, m] = ym.split('-').map(Number);
  ym = iso(new Date(y, m - 1 + n, 1)).slice(0, 7);
  setDate(); loadTx();
}
async function loadTx() {
  const [y, m] = ym.split('-').map(Number), last = new Date(y, m, 0).getDate();
  tx = await ok(sb.from('transactions').select('*')
    .gte('occurred_on', ym + '-01').lte('occurred_on', `${ym}-${pad(last)}`)
    .order('occurred_on', { ascending: false }).order('created_at', { ascending: false }));
  $('month-label').textContent = new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  renderAll();
}
async function loadBills() {
  const s = await ok(sb.from('settings').select('salary').eq('id', 1).single());
  salary = Number(s.salary);
  bills = await ok(sb.from('fixed_bills').select('*').order('created_at').order('name'));
  renderAll();
}

/* ---------- desenhar ---------- */
function renderAll() { renderHero(); renderChips(); renderFilters(); renderLedger(); renderCats(); renderBills(); }

function renderHero() {
  const inc = salary + sum('entrada') + sum('acrescimo');
  const b = billsTotal(), c = sum('compra'), r = sum('retirada');
  const bal = inc - b - c - r, base = Math.max(inc, b + c + r) || 1;
  const el = $('balance');
  el.textContent = brl(bal); el.className = 'big ' + (bal >= 0 ? 'pos' : 'neg');
  $('verdict').textContent = bal >= 0
    ? (inc ? `${Math.round((bal / inc) * 100)}% da renda do mês ainda está livre.` : 'Nenhuma renda registrada neste mês.')
    : `Você gastou ${brl(-bal)} acima da renda deste mês.`;
  const segs = [['Contas fixas', b, 'violet'], ['Compras', c, 'coral'], ['Retiradas', r, 'amber'], ['Sobra', Math.max(bal, 0), 'mint']];
  $('split').innerHTML = segs.filter((s) => s[1] > 0).map((s) => `<i class="${s[2]}" style="flex:${s[1] / base}" title="${s[0]}"></i>`).join('');
  $('legend').innerHTML = segs.map((s) => `<li><i class="${s[2]}"></i>${s[0]} <b>${brl(s[1])}</b></li>`).join('');
  $('s-sal').textContent = brl(salary);
  $('s-in').textContent = brl(sum('entrada') + sum('acrescimo'));
  $('s-bills').textContent = brl(b);
  $('s-out').textContent = brl(c + r);
}

function renderChips() {
  $('types').innerHTML = Object.keys(T).map((k) =>
    `<button type="button" class="pill" aria-pressed="${k === type}" onclick="setType('${k}')">${T[k].l}</button>`).join('');
  const seen = new Set(), list = [];
  [...DEF[type], ...tx.filter((x) => x.type === type && x.category).map((x) => x.category)].forEach((c) => {
    const k = norm(c); if (!seen.has(k)) { seen.add(k); list.push(c); }
  });
  $('chips').innerHTML = list.slice(0, 10).map((c) =>
    `<button type="button" class="pill sm" data-c="${esc(c)}" onclick="$('f-cat').value=this.dataset.c">${esc(c)}</button>`).join('');
}
function setType(k) { type = k; renderChips(); }

function renderFilters() {
  const f = { all: 'Tudo', compra: 'Compras', retirada: 'Retiradas', entrada: 'Entradas', acrescimo: 'Acréscimos' };
  $('filters').innerHTML = Object.keys(f).map((k) =>
    `<button class="pill sm" aria-pressed="${k === flt}" onclick="flt='${k}';renderFilters();renderLedger()">${f[k]}</button>`).join('');
}

const dayLabel = (d) => {
  if (d === iso(new Date())) return 'Hoje';
  if (d === iso(new Date(Date.now() - 864e5))) return 'Ontem';
  return new Date(d + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });
};

function renderLedger() {
  const list = tx.filter((x) => (flt === 'all' || x.type === flt) && (!q || norm((x.category || '') + ' ' + (x.description || '')).includes(norm(q))));
  if (!list.length) {
    $('ledger').innerHTML = `<p class="empty">${tx.length ? 'Nada encontrado com esse filtro.' : 'Nenhuma movimentação neste mês. Registre a primeira no formulário.'}</p>`;
    return;
  }
  const days = {};
  list.forEach((x) => (days[x.occurred_on] ??= []).push(x));
  $('ledger').innerHTML = Object.keys(days).sort().reverse().map((d) => {
    const net = days[d].reduce((s, x) => s + T[x.type].s * Number(x.amount), 0);
    return `<h3 class="day"><span>${dayLabel(d)}</span><span class="num ${net >= 0 ? 'pos' : 'neg'}">${net >= 0 ? '+' : '−'} ${brl(Math.abs(net))}</span></h3>` +
      days[d].map((x) => {
        const s = T[x.type].s;
        const sub = [x.description, x.source === 'telegram' ? 'via bot' : ''].filter(Boolean).map(esc).join(' · ');
        return `<div class="item"><span class="ic">${T[x.type].i}</span>
          <div class="who"><b>${esc(x.category || T[x.type].l)}</b>${sub ? `<small>${sub}</small>` : ''}</div>
          <span class="num ${s > 0 ? 'pos' : 'neg'}">${s > 0 ? '+' : '−'} ${brl(x.amount)}</span>
          <button class="x" aria-label="Excluir" onclick="delTx('${x.id}')">✕</button></div>`;
      }).join('');
  }).join('');
}

function renderCats() {
  const m = new Map();
  tx.filter((x) => x.type === 'compra').forEach((x) => {
    const k = norm(x.category || 'sem categoria'), c = m.get(k) || { n: cap(x.category) || 'Sem categoria', v: 0 };
    c.v += Number(x.amount); m.set(k, c);
  });
  const a = [...m.values()].sort((p, r) => r.v - p.v).slice(0, 6);
  $('cats').innerHTML = a.length
    ? a.map((c) => `<div class="bar"><div><span>${esc(c.n)}</span><b class="num">${brl(c.v)}</b></div><i style="width:${(c.v / a[0].v * 100).toFixed(0)}%"></i></div>`).join('')
    : '<p class="empty">Nenhuma compra neste mês.</p>';
}
const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);

function renderBills() {
  $('bills').innerHTML = bills.length ? bills.map((b) => `<div class="bill">
    <input type="checkbox" class="sw" ${b.active ? 'checked' : ''} aria-label="Conta ativa" onchange="upBill('${b.id}',{active:this.checked})">
    <span class="${b.active ? '' : 'off'}">${esc(b.name)}</span>
    <input class="amt" inputmode="decimal" value="${Number(b.amount).toFixed(2)}" aria-label="Valor" onchange="upBill('${b.id}',{amount:num(this.value)||0})">
    <button class="x" aria-label="Excluir" onclick="delBill('${b.id}')">✕</button></div>`).join('')
    : '<p class="empty">Nenhuma conta fixa. Adicione a primeira abaixo.</p>';
  $('bills-total').textContent = brl(billsTotal());
}

/* ---------- ações ---------- */
async function submitTx(e) {
  e.preventDefault();
  const amount = num($('f-amount').value);
  if (!(amount > 0)) return toast('Informe um valor maior que zero.', 1);
  await ok(sb.from('transactions').insert({
    type, amount,
    category: $('f-cat').value.trim() || null,
    description: $('f-desc').value.trim() || null,
    occurred_on: $('f-date').value || iso(new Date()),
    source: 'site',
  }));
  ['f-amount', 'f-cat', 'f-desc'].forEach((i) => ($(i).value = ''));
  toast(T[type].l + ' registrada.');
  loadTx();
}
async function delTx(id) {
  if (!confirm('Excluir esta movimentação?')) return;
  await ok(sb.from('transactions').delete().eq('id', id));
  toast('Movimentação excluída.'); loadTx();
}
async function upBill(id, p) { await ok(sb.from('fixed_bills').update(p).eq('id', id)); loadBills(); }
async function delBill(id) {
  if (!confirm('Excluir esta conta fixa?')) return;
  await ok(sb.from('fixed_bills').delete().eq('id', id));
  toast('Conta excluída.'); loadBills();
}
async function addBill() {
  const name = $('nb-name').value.trim(), amount = num($('nb-amt').value);
  if (!name || !(amount > 0)) return toast('Informe o nome e o valor da conta.', 1);
  await ok(sb.from('fixed_bills').insert({ name, amount }));
  $('nb-name').value = ''; $('nb-amt').value = '';
  toast('Conta adicionada.'); loadBills();
}
function openSalary() { $('d-sal').value = salary.toFixed(2); $('dlg').showModal(); }
async function saveSalary(e) {
  e.preventDefault();
  const n = num($('d-sal').value);
  if (!(n >= 0)) return;
  await ok(sb.from('settings').update({ salary: n }).eq('id', 1));
  $('dlg').close(); toast('Salário atualizado.'); loadBills();
}
function exportCsv() {
  const rows = [['data', 'tipo', 'categoria', 'descricao', 'valor', 'origem'],
    ...tx.map((x) => [x.occurred_on, x.type, x.category || '', x.description || '', Number(x.amount).toFixed(2), x.source || ''])];
  const csv = rows.map((r) => r.map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
  a.download = `financeiro-${ym}.csv`; a.click();
}

/* ---------- tempo real (site + bot) ---------- */
sb.channel('financas-sync')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'transactions' }, loadTx)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'fixed_bills' }, loadBills)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, loadBills)
  .subscribe((s) => {
    $('dot').className = s === 'SUBSCRIBED' ? 'on' : '';
    $('sync').textContent = s === 'SUBSCRIBED' ? 'Ao vivo · site e bot' : 'Conectando…';
  });

setDate();
loadBills().then(loadTx).catch(() => {});
</script>
